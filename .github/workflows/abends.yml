# Abend-Vorschau an die Putzkräfte (ntfy-App): jeden Abend, was morgen zu tun ist.
# GitHub rechnet in UTC: 17:07 UTC = 18:07 Uhr im Winter, 19:07 Uhr im Sommer.
name: Abend-Vorschau
# Zeitplan vorerst aus: gewünscht ist Webseiten-Push statt der ntfy-App. Von Hand startbar bleibt der Ablauf.
on:
  workflow_dispatch:
jobs:
  senden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/abends.mjs
