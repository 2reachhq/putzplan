<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F2F2F2">
<title>Putzplan – Admin</title><link rel="icon" href="../icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../plan.css">
<style>
main{padding-bottom:120px}
.box{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.box input,.feld input,.feld select{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #D6D6D6;border-radius:10px;background:#fff;color:#161616;width:100%;box-sizing:border-box;min-width:0;max-width:100%}
.pin{letter-spacing:.3em;text-align:center;font-size:24px!important}
.knopf{font:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:12px;border:0;background:#161616;color:#fff;cursor:pointer}
.knopf.hell{background:#fff;color:#161616;border:1px solid #E2E2E2}.knopf.rot{background:#fff;color:#D93636;border:1px solid #F0C4C4}
.knopf:disabled{opacity:.4}
.fehler{color:#D93636;font-size:16px}
.leiste{display:flex;gap:8px;margin:0 0 12px}.leiste .knopf{flex:1;font-size:12px;padding:9px 8px}
.haus{font-size:24px;font-weight:800;margin:6px 4px 8px;letter-spacing:-.01em}
.adm .lab{flex-basis:88px;width:88px;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 8px;gap:1px}
.adm .lab b{font-size:16px}.adm .lab small{font-size:12px;font-weight:500;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.adm .ecke{align-items:center}
.adm .mseg .mo{left:96px}
.adm .trk{cursor:pointer}
.bk{cursor:pointer}.bk.pruefen{background:#F5C400;color:#161616}.bk.offen{box-shadow:0 0 0 3px #161616}
.abschnitt{font-size:12px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}.abschnitt.rot{color:#D93636}
.zeile{background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;border:2px solid transparent}
.zeile.rot{border-color:#D93636}.zeile.orange{border-color:#F5C400}
.zeile b{font-size:16px}.klein{font-size:12px;color:#777}
.unten{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(242,242,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #E2E2E2;z-index:5}
.unten .innen{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.unten .knopf{width:100%;padding:14px;background:#EE7310}
.meldung{font-size:12px;color:#2B8C78;text-align:center;min-height:15px}
/* Blatt von unten */
.blatt{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);color:#161616}
.blatt::backdrop{background:rgba(0,0,0,.35)}
.blatt[open]{animation:hoch .2s ease-out}@keyframes hoch{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.blatt .in{padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.blatt h2{margin:0;font-size:24px}.blatt .unter{font-size:12px;color:#777;margin-top:-8px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:10px}.raster .breit{grid-column:1/-1}
.feld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#666;min-width:0}
.feld.rot input,.feld.rot select{border-color:#D93636;background:#FFF5F5}
.knoepfe{display:flex;gap:8px}.knoepfe .knopf{flex:1}
.feld input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
.feld input[type=date]::-webkit-date-and-time-value{text-align:left}
.bkopf{display:flex;align-items:center;gap:12px;min-width:0}.bkt{min-width:0}.bkt h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bkt .unter{margin-top:2px}
.qlogo{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.warn{background:#FDECEC;color:#A51B1B;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.bk.ueber,.bk.ueber.vorbei{background:repeating-linear-gradient(135deg,#D93636 0 7px,#B42525 7px 14px)}
.code{align-self:flex-start;display:flex;align-items:center;gap:10px;font:inherit;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid #E2E2E2;background:#F6F6F6;color:#161616;cursor:pointer;max-width:100%}
.code span{font-size:16px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code em{font-style:normal;font-size:12px;font-weight:600;background:#161616;color:#fff;border-radius:8px;padding:6px 10px;white-space:nowrap}
.code.ok{border-color:#2B8C78;color:#2B8C78}.code.ok em{background:#2B8C78}
.codezeile{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.codezeile .code{align-self:auto}
.putzinfo{background:#F4FAF8;border:1px solid #CFE7DF;border-radius:14px;padding:10px 12px 12px}.pih{font-size:12px;font-weight:700;color:#1E6E5C;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.feld textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid #DADADA;background:#fff;resize:vertical;min-height:52px}
.bk .uhr{display:inline-flex;margin-left:3px;opacity:.95}
.bk .neu{margin-left:3px;font-size:12px;line-height:1}
.extlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:#161616;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.zeiten{display:flex;gap:16px;align-items:flex-end}
/* Reiter Buchungen | Putzkosten */
.reiter{display:flex;background:#E4E4E4;border-radius:12px;padding:3px;margin:0 0 12px}
.reiter button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;background:none;min-height:40px;border-radius:10px;color:#555;cursor:pointer}
.reiter button.an{background:#fff;color:#161616;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.monatwahl{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:6px;margin:0 0 12px}
.monatwahl b{font-size:17px}
.monatwahl button{width:44px;height:44px;border:0;border-radius:10px;background:#F2F2F2;color:#161616;font-size:22px;line-height:1;cursor:pointer}
.kgesamt{background:#161616;color:#fff;border-radius:16px;padding:16px 18px;margin:0 0 4px}
.kgesamt span{font-size:13px;color:#BDBDBD;display:block}
.kgesamt b{font-size:32px;font-weight:800;display:block;margin:2px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kgesamt .klein{color:#BDBDBD}
.kh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kkarte{background:#fff;border-radius:16px;padding:4px 14px 8px}
.kz2{display:grid;grid-template-columns:minmax(0,1fr) auto 96px 86px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F0}
.kwg b{font-size:16px}.kwg small{display:block;font-size:12px;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanz{text-align:right;font-variant-numeric:tabular-nums}.kanz b{font-size:16px}.kanz small{display:block;color:#D93636;font-size:11px;white-space:nowrap}
.kpreis{display:flex;align-items:center;gap:4px;color:#777;font-size:14px}
.kpreis input,.kx input,.kx select{font:inherit;font-size:16px;padding:9px 8px;border:1px solid #D6D6D6;border-radius:10px;background:#fff;color:#161616;width:100%;box-sizing:border-box;min-width:0}
.kpreis input{text-align:right}
.kbetrag{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ksum{display:flex;justify-content:space-between;gap:10px;padding:12px 0 6px;font-weight:700;font-size:16px}.ksum b{font-variant-numeric:tabular-nums}
.kanz small.grau{color:#8A8A8A}
.kgez{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;color:#555;padding:0 0 8px}.kgez b{text-align:right;font-variant-numeric:tabular-nums;color:#161616}
.kgez b.off{color:#C25E00}.kgez b.ok{color:#2B8C78}
.kbez{display:flex;gap:14px;font-size:14px;font-weight:600;margin:0 0 4px}.kbez .off{color:#FFB15C}.kbez .ok{color:#7FD8C3}
.kd2{padding:8px 0;border-top:1px solid #F2F2F2}.kd2.aus .kdk{color:#9A9A9A;text-decoration:line-through}.kd2.geplant{color:#9A9A9A}
.kdk{display:grid;grid-template-columns:76px 46px minmax(0,1fr);gap:6px;font-size:13px;margin-bottom:6px}.kdk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kdk em{font-style:normal;color:#D93636}
.kd2.geplant .kdk{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#F0F0F0;border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;min-height:36px;border-radius:8px;color:#666;cursor:pointer}
.seg button.an{background:#fff;color:#161616;box-shadow:0 1px 2px rgba(0,0,0,.12)}.seg button.an.bezahlt{background:#2B8C78;color:#fff}.seg button.an.aus{background:#5A5A5A;color:#fff}
.kalle{width:100%;margin:2px 0 8px;font-size:14px}
.kxbez{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;color:#555;min-height:36px}.kxbez input{width:20px;height:20px;accent-color:#2B8C78;margin:0}
.kd2 i{font-style:normal;font-size:11px;background:#F0F0F0;border-radius:6px;padding:1px 6px}

.kdet summary{font-size:14px;color:#1E6E5C;font-weight:600;min-height:40px;display:flex;align-items:center;cursor:pointer}
.kx{display:grid;grid-template-columns:minmax(0,1fr) 112px 44px;gap:8px;padding:10px 0;border-bottom:1px solid #F0F0F0;align-items:center}
.kx .ktext{grid-column:1/-1}
.kweg{width:44px;height:44px;border:0;border-radius:10px;background:#FDECEC;color:#A51B1B;font-size:20px;cursor:pointer}
.kplus{margin:10px 0 4px;width:100%}
.kleer{font-size:14px;color:#777;padding:10px 0}.st.de b{color:#FF3D00}
</style></head>
<body><header><div class="kz"><div><span class="ort">Admin</span><h1>Buchungen</h1></div><div class="zeiten"><div class="st de"><span>Deutschland</span><b id="dezeit"></b></div><div class="st"><span>Stand</span><b id="stand"></b></div></div></div></header>
<main id="app"><div class="hinweis">…</div></main>
<div class="unten" id="unten" hidden><div class="innen"><div class="meldung" id="meldung"></div><button class="knopf" id="pub" disabled>Veröffentlichen</button></div></div>
<dialog class="blatt" id="blatt"><form class="in" id="blattForm" method="dialog"></form></dialog>
<script src="../dienst.js"></script>
<script>
/* Admin (nur für den Betreiber): beide Häuser als Kalender. Buchung antippen → ändern/verlängern/stornieren; leeren Tag
   antippen → blockieren (Personen, bis wann). Alles wird gesammelt und erst mit „Veröffentlichen“ an den Dienst geschickt,
   der dann Putzplan-Seiten, Push und die Buchhaltungs-App aktualisiert. Anmeldung mit der PIN aus dem privaten Blatt „Info“ (nur ein Admin). */
(function(){
  const D=self.DIENST;const app=document.getElementById('app');const W=48,LAB=88;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* Angemeldet bleiben: die PIN merkt sich nur DIESES Gerät, 7 Tage lang */
  const TAGE7=7*864e5;let pin='';try{pin=localStorage.getItem('putzplan.pin')||'';if(!(+localStorage.getItem('putzplan.pinBis')>Date.now())){pin='';localStorage.removeItem('putzplan.pin')}}catch(e){}
  let daten=null;const offen=new Map();let neuNr=0,scrollX=null;let ansicht='buchungen';
  const dienst=o=>fetch(D,{method:'POST',body:JSON.stringify({...o,pin})}).then(r=>r.json());
  const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
  /* Alle Zeiten nach deutscher Zeit – der Admin wird auch aus dem Ausland (Thailand) bedient */
  const deUhr=()=>new Date().toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit'});
  const deIso=()=>{const t={};for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()))t[x.type]=x.value;return t.year+'-'+t.month+'-'+t.day};
  const deTick=()=>{const e=document.getElementById('dezeit');if(e)e.textContent=new Date().toLocaleString('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','')};
  deTick();setInterval(deTick,15000);
  /* Über Mitternacht (deutsche Zeit) offen gelassen: beim Zurückkommen neu laden – aber nie, solange Ungespeichertes offen ist */
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){deTick();if(typeof daten!=='undefined'&&daten&&daten.heute&&daten.heute!==deIso()&&!offen.size)laden()}});
  const plus=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  const tage=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5);
  const dat=s=>s?WT[new Date(s+'T12:00:00Z').getUTCDay()]+' '+s.slice(8)+'.'+s.slice(5,7)+'.':'?';
  const unten=document.getElementById('unten'),pub=document.getElementById('pub'),meld=document.getElementById('meldung');
  const blatt=document.getElementById('blatt'),bf=document.getElementById('blattForm');
  if(!D){app.innerHTML='<div class="hinweis">Der Dienst ist noch nicht eingerichtet.</div>';return}

  /* ---------- Anmeldung mit PIN ---------- */
  function anmelden(fehler){unten.hidden=true;
    app.innerHTML='<form class="box" id="f"><b>Anmelden</b><input class="pin" type="password" inputmode="numeric" pattern="[0-9]*" id="p1" placeholder="PIN" autocomplete="current-password" required>'
      +(fehler?'<div class="fehler">'+esc(fehler)+'</div>':'')+'<button class="knopf">Weiter</button></form>';
    document.getElementById('f').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('p1').value.trim();
      const r=await dienst({typ:'login'}).catch(()=>null);if(r&&r.ok){try{localStorage.setItem('putzplan.pin',pin);localStorage.setItem('putzplan.pinBis',String(Date.now()+TAGE7))}catch(e){}laden()}else anmelden(r?'PIN falsch (nach 5 Fehlversuchen 1 Stunde gesperrt).':'Keine Verbindung.')}}

  async function laden(){const r=await dienst({typ:'liste'}).catch(()=>null);if(!r||!r.ok){anmelden(r&&r.fehler==='passwort'?'':'Keine Verbindung.');return}
    daten=r;neueMerken();offen.clear();unten.hidden=ansicht!=='buchungen';zeigen();const st=document.getElementById('stand');st.textContent=deUhr();
    /* Beim Öffnen sofort Gmail abgleichen (im Hintergrund) und danach neu laden – nicht erst auf den 5-Minuten-Lauf warten */
    if(!laden.auto){laden.auto=true;st.textContent='Gmail …';await dienst({typ:'abgleich'}).catch(()=>null);if(!offen.size)await laden();else st.textContent=deUhr()}}

  /* Neue Buchungen bekommen ✨ neben der Personenzahl – nur bei diesem Öffnen; beim nächsten Mal sind sie „gesehen“.
     Gemerkt wird je Gerät (localStorage). Erster Besuch ohne Merkliste: alles gilt als gesehen, sonst funkelt der ganze Kalender.
     Selbst angelegte Einträge (man-…) funkeln nie. */
  const NEU_KEY='putzplan.gesehen';const neuJetzt=new Set();
  function neueMerken(){let g=null;try{g=JSON.parse(localStorage.getItem(NEU_KEY)||'null')}catch(e){}
    if(Array.isArray(g)){const s=new Set(g);for(const b of daten.buchungen)if(!s.has(b.id)&&!/^man-/.test(b.id))neuJetzt.add(b.id)}
    try{localStorage.setItem(NEU_KEY,JSON.stringify(daten.buchungen.map(b=>b.id)))}catch(e){}}
  /* ---------- Stand = Server + noch nicht veröffentlichte Änderungen ---------- */
  /* Gelb nur für Aufenthalte, die noch kommen oder laufen – ein vorbeigegangener braucht keine Prüfung mehr */
  const stand=b=>{const f=(offen.get(b.id)||{}).felder||{};const x={...b,...f,...(f.geprueft?{pruefen:''}:{})};if(x.pruefen&&x.abreise&&x.abreise<daten.heute)x.pruefen='';return x};
  const alle=()=>daten.buchungen.map(stand).filter(b=>b.status!=='storniert'||offen.has(b.id));
  const fehlt=b=>b.status!=='storniert'&&(!b.gaeste||!b.abreise||!b.wg||!b.haus)&&(b.abreise||b.anreise||'9')>=daten.heute;
  const hausVon=id=>daten.haeuser.find(h=>h.id===id);
  /* Buchungen derselben Wohnung, deren Nächte sich mit b überschneiden – darf es nie geben */
  const ueberVon=b=>{const ab=b.abreise||plus(b.anreise,1);return alle().filter(o=>o.id!==b.id&&o.status!=='storniert'&&b.status!=='storniert'&&o.haus===b.haus&&+o.wg===+b.wg&&o.anreise&&b.anreise&&o.anreise<ab&&b.anreise<(o.abreise||plus(o.anreise,1)))};

  function kalender(h,von,N){const heute=daten.heute;const L=alle().filter(b=>b.haus===h.id&&b.status!=='storniert');
    let kopf='';for(let i=0;i<N;i++){const d=plus(von,i);const dt=new Date(d+'T12:00:00Z');
      kopf+='<div class="kt'+(d===heute?' heute':'')+(d<heute?' vorbei':'')+'" style="left:'+(i*W)+'px">'
        +'<span class="wd">'+WT[dt.getUTCDay()]+'</span><span class="nr">'+dt.getUTCDate()+'</span></div>'}
    /* Monat als „06/2026“: bleibt beim Seitwärtsscrollen links an der Linie stehen, bis der nächste ihn wegschiebt */
    for(let i=0;i<N;){const dt=new Date(plus(von,i)+'T12:00:00Z');let n=1;while(i+n<N&&plus(von,i+n).slice(8)!=='01')n++;
      kopf+='<div class="mseg'+(i?'':' erst')+'" style="left:'+(i*W)+'px;width:'+(n*W)+'px"><span class="mo">'+String(dt.getUTCMonth()+1).padStart(2,'0')+'/'+dt.getUTCFullYear()+'</span></div>';i+=n}
    let z='';for(const w of h.wgs){let bars='';
      /* Überschneidungen (meist ein fehlendes Storno) liegen in eigenen Spuren untereinander und sind rot gestreift */
      const lst=L.filter(x=>+x.wg===+w&&x.anreise).map(b=>({b,ab:b.abreise||plus(b.anreise,1)})).filter(o=>o.ab>=von&&o.b.anreise<=plus(von,N-1)).sort((p,q)=>p.b.anreise.localeCompare(q.b.anreise));
      const enden=[];lst.forEach(o=>{let l=enden.findIndex(e=>e<=o.b.anreise);if(l<0){l=enden.length;enden.push('')}enden[l]=o.ab;o.l=l});const nl=enden.length;
      for(const o of lst){const b=o.b,ab=o.ab;
        const x=(tage(von,b.anreise)+.5)*W+5,wd=tage(b.anreise,ab)*W-10;/* wie bei Airbnb: von Mitte Anreisetag bis Mitte Abreisetag */const cls=ueberVon(b).length?' ueber':b.pruefen?' pruefen':fehlt(b)?' rot':'';/* gelb vor rot: der Gast hat geändert, die Mail nennt die neuen Daten nicht */
        bars+='<div class="bk'+cls+(offen.has(b.id)?' offen':'')+(ab<=heute?' vorbei':'')+'" data-id="'+esc(b.id)+'" style="left:'+x+'px;width:'+wd+'px'+(nl>1?';top:'+(9+o.l*40)+'px;transform:none':'')+'"><b>'+(b.gaeste?esc(b.gaeste):'?')+'</b>'+(neuJetzt.has(b.id)?'<span class="neu" title="Neue Buchung">✨</span>':'')+(b.frueh||b.spaet||b.notiz?'<span class="uhr" title="Hinweis für Putzkräfte"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>':'')+'</div>'}
      z+='<div class="r"><div class="lab"><b>'+w+'</b><small>'+esc((h.namen||{})[w]||'')+'</small></div><div class="trk" data-haus="'+h.id+'" data-wg="'+w+'" style="width:'+(N*W)+'px'+(nl>1?';height:'+(12+nl*40)+'px':'')+'">'+bars+'</div></div>'}
    const ti=tage(von,heute);
    return '<div class="haus">'+esc(h.name)+'</div><div class="karte adm"><div class="kal"><div class="kin" style="width:'+(LAB+N*W)+'px">'
      +(ti>=0&&ti<N?'<div class="sp heute" style="left:'+(LAB+ti*W)+'px"></div>':'')
      +'<div class="r kopf"><div class="lab ecke"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B8C78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></div><div class="trk" style="width:'+(N*W)+'px;cursor:default">'+kopf+'</div></div>'
      +z+'</div></div></div>'}

    const nN=b.anreise&&b.abreise?tage(b.anreise,b.abreise):0;const ue=neu?[]:ueberVon(b);
    bf.innerHTML='<div class="bkopf">'+quelleLogo(neu?'block':b.quelle)+'<div class="bkt"><h2>'+(neu?'Blockieren':esc(b.gast||'Buchung'))+'</h2><div class="unter">'+(neu?esc(h?h.name:''):esc(b.quelle==='airbnb'?'Airbnb':b.quelle==='booking'?'Booking.com':'Direkt')+(b.pruefen?' · geändert – bitte prüfen':''))+'</div></div></div>'
      +(ue.length?'<div class="warn">Überschneidet sich mit '+ue.map(o=>esc(o.gast||(o.quelle==='airbnb'?'Airbnb':'Booking'))+' ('+dat(o.anreise)+' → '+dat(o.abreise)+')').join(', ')+'. Eine der Buchungen ist vermutlich storniert oder verlegt – bitte bei Airbnb/Booking prüfen.</div>':'')
      +(neu||!b.code?'':'<div class="codezeile"><button type="button" class="code" id="bCode" title="Buchungsnummer kopieren"><span>'+esc(b.code)+'</span></button>'
        +(quelleLink(b)?'<a class="extlink" href="'+esc(quelleLink(b))+'" target="_blank" rel="noopener" title="'+(b.quelle==='airbnb'?'Bei Airbnb öffnen':'Bei Booking öffnen')+'">'+'Öffnen</a>':'')+'</div>')
      +'<div class="raster"><label class="feld breit">Wohnung<select name="wohnung">'+wohn.map(o=>'<option value="'+o.v+'"'+(o.v===b.haus+'|'+b.wg?' selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select></label>'
      +'<label class="feld breit">'+(neu?'Ab':'Anreise')+'<input type="date" name="anreise" value="'+esc(b.anreise)+'" required></label>'
      +'<label class="feld'+(!b.abreise?' rot':'')+'">Nächte<select name="naechte"><option value="">–</option>'+[...Array(30)].map((_,i)=>i+1).concat(nN>30?[nN]:[]).map(n=>'<option'+(nN===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label>'
      +'<label class="feld'+(!b.abreise?' rot':'')+'">Bis wann<input type="date" name="abreise" value="'+esc(b.abreise)+'"></label>'
      +'<label class="feld'+(!b.gaeste?' rot':'')+'">Personen<select name="gaeste"><option value="">–</option>'+[1,2,3,4,5,6,7].concat(+b.gaeste>7?[+b.gaeste]:[]).map(n=>'<option'+(+b.gaeste===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label>'
      +'<label class="feld">Name<input type="text" name="gast" value="'+esc(b.gast)+'" placeholder="'+(neu?'Blockiert':'')+'"></label></div>'
      +'<div class="putzinfo"><div class="pih">Für die Putzkräfte</div><div class="raster">'
      +'<label class="feld">Early Check-in<select name="frueh">'+zeitOpt(['09:00','10:00','11:00','12:00','13:00','14:00'],b.frueh)+'</select></label>'
      +'<label class="feld">Late Check-out<select name="spaet">'+zeitOpt(['12:00','13:00','14:00','15:00','16:00','17:00'],b.spaet)+'</select></label>'
      +'<label class="feld breit">Notiz<textarea name="notiz" rows="2" maxlength="200" placeholder="z. B. Babybett aufbauen, extra Handtücher">'+esc(b.notiz)+'</textarea></label></div></div>'
      +'<div class="knoepfe"><button class="knopf hell" type="button" id="bZu">Abbrechen</button><button class="knopf" value="ok" id="bOk">'+(b.pruefen&&!neu?'Geprüft':'Übernehmen')+'</button></div>'
      +(neu?'':'<button class="knopf rot" type="button" id="bStorno">Buchung stornieren</button>');
    bf.querySelector('#bZu').onclick=()=>blatt.close();
    /* Nächte oder „Bis wann“ – das andere rechnet sich aus */
    const fA=bf.elements.anreise,fB=bf.elements.abreise,fN=bf.elements.naechte;
    const ausN=()=>{if(fA.value&&fN.value)fB.value=plus(fA.value,+fN.value)};
    fN.onchange=ausN;fA.onchange=()=>{if(fN.value)ausN()};
    fB.onchange=()=>{const n=fA.value&&fB.value?tage(fA.value,fB.value):0;if(n>0&&![...fN.options].some(o=>+o.value===n))fN.add(new Option(String(n),String(n)));fN.value=n>0?String(n):''};
    const cb=bf.querySelector('#bCode');if(cb)cb.onclick=()=>{cb.style.minWidth=cb.offsetWidth+'px';return kopieren(b.code).then(ok=>{const e=cb.querySelector('span');cb.classList.toggle('ok',ok);e.textContent=ok?'Kopiert ✓':'Nicht möglich';clearTimeout(cb.t);cb.t=setTimeout(()=>{cb.classList.remove('ok');e.textContent=b.code},1500)})};/* ganze Nummer antippen = kopieren */
    const nehmen=status=>{const f=new FormData(bf);const[hh,ww]=String(f.get('wohnung')||'|').split('|');
      const felder={haus:hh,wg:ww,anreise:f.get('anreise')||'',abreise:f.get('abreise')||'',gaeste:f.get('gaeste')||'',gast:f.get('gast')||(neu?'Blockiert':''),frueh:f.get('frueh')||'',spaet:f.get('spaet')||'',notiz:String(f.get('notiz')||'').trim()};
      if(b.pruefen&&!neu)felder.geprueft='1';/* auch ohne Änderung: „Geprüft“ veröffentlichen nimmt das Gelb weg */
      if(felder.abreise&&felder.anreise&&felder.abreise<=felder.anreise){alert('„Bis wann“ muss nach dem Anfang liegen.');return false}
      if(status)felder.status=status;
      if(neu){daten.buchungen.push({id:b.id,quelle:'direkt',status:'bestaetigt'});offen.set(b.id,{id:b.id,felder})}
      else{const alt=daten.buchungen.find(x=>x.id===id);const o=offen.get(id)||{id,felder:{}};Object.assign(o.felder,felder);
        for(const k of Object.keys(o.felder))if(String(o.felder[k]??'')===String(alt[k]??''))delete o.felder[k];
        if(Object.keys(o.felder).length)offen.set(id,o);else offen.delete(id)}
      blatt.close();meld.textContent='';zeigen();return true};
    bf.onsubmit=e=>{e.preventDefault();nehmen()};
    const st=bf.querySelector('#bStorno');if(st)st.onclick=()=>{if(confirm('Diese Buchung stornieren? Sie verschwindet nach dem Veröffentlichen überall.'))nehmen('storniert')};
    blatt.showModal()}

  app.addEventListener('click',async e=>{if(kostenKlick(e))return;const a=e.target.closest('[data-a]');
    if(a){if(a.dataset.a==='abmelden'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem abmelden?'))return;pin='';try{localStorage.removeItem('putzplan.pin')}catch(err){}anmelden();return}
      if(a.dataset.a==='abgleich'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem neu laden?'))return;a.disabled=true;a.textContent='Gmail wird gelesen …';await dienst({typ:'abgleich',tage:45}).catch(()=>null);await laden();return}}
    const bar=e.target.closest('.bk[data-id],.zeile[data-id]');if(bar){oeffnen(bar.dataset.id);return}
    const t=e.target.closest('.trk[data-wg]');if(t){const r=t.getBoundingClientRect();const i=Math.floor((e.clientX-r.left)/W);const d=plus(plus(daten.heute,-7),i);
      oeffnen(null,{haus:t.dataset.haus,wg:t.dataset.wg,anreise:d,abreise:plus(d,1),gaeste:2,gast:''})}});
  blatt.addEventListener('click',e=>{if(e.target===blatt)blatt.close()});

  pub.addEventListener('click',async()=>{if(!offen.size)return;pub.disabled=true;pub.textContent='Wird veröffentlicht …';meld.style.color='';
    const r=await dienst({typ:'veroeffentlichen',aenderungen:[...offen.values()]}).catch(()=>null);
    if(r&&r.ok){const n=offen.size;await laden();meld.textContent=n+' Änderung'+(n===1?'':'en')+' veröffentlicht – Putzplan und App sind aktualisiert.'}
    else{meld.style.color='#D93636';meld.textContent='Veröffentlichen ging nicht'+(r&&r.fehler?' ('+r.fehler+')':'')+'. Bitte nochmal.';zaehler()}});
  addEventListener('beforeunload',e=>{if(offen.size){e.preventDefault();e.returnValue=''}});
  pin?laden():anmelden();
})();
</script></body></html>
