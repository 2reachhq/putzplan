<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F2F2F2">
<title>Putzplan – Admin</title><link rel="icon" href="../icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../plan.css">
<style>
main{padding-bottom:110px}
.anmelden{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.anmelden input,.feld input,.feld select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #D6D6D6;border-radius:10px;background:#fff;color:#161616;width:100%;box-sizing:border-box;min-width:0;max-width:100%}
.knopf{font:inherit;font-size:16px;font-weight:600;padding:11px 16px;border-radius:12px;border:0;background:#161616;color:#fff;cursor:pointer}
.knopf.hell{background:#fff;color:#161616;border:1px solid #E2E2E2}
.knopf:disabled{opacity:.4}
.leiste{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bu{background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 10px;border:2px solid transparent}
.bu.fehlt{border-color:#D93636}.bu.geaendert{border-color:#EE7310;background:#FFF8F1}.bu.storno{opacity:.5}
.kopf2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kopf2 b{font-size:20px}.klein{font-size:12px;color:#777}
.wo{font-size:16px;font-weight:600;margin-top:2px}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.raster .breit{grid-column:1/-1}
.feld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#666;min-width:0}
.feld.rot input,.feld.rot select{border-color:#D93636;background:#FFF5F5}
.zeile{display:flex;justify-content:flex-end;margin-top:8px}
.link{font:inherit;font-size:12px;color:#777;background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.abschnitt{font-size:12px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.abschnitt.rot{color:#D93636}
.unten{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(242,242,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #E2E2E2}
.unten .innen{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.unten .knopf{width:100%;padding:14px;background:#EE7310}
.meldung{font-size:12px;color:#2B8C78;text-align:center;min-height:15px}
</style></head>
<body><header><div class="kz"><div><span class="ort">Admin</span><h1>Buchungen</h1></div><div class="st"><span>Kranzstraße 9</span><b>Poetherweg 17</b></div></div></header>
<main id="app"><div class="hinweis">…</div></main>
<div class="unten" id="unten" hidden><div class="innen"><div class="meldung" id="meldung"></div><button class="knopf" id="pub" disabled>Veröffentlichen</button></div></div>
<script src="../dienst.js"></script>
<script>
/* Admin: alle Buchungen beider Häuser in EINER Liste. Fehlende Angaben (Abreise, Gäste, Wohnung) eintragen, Name ergänzen,
   stornieren oder neu anlegen – die Änderungen werden erst gesammelt und mit „Veröffentlichen“ auf einmal an den Dienst
   geschickt. Der schreibt dann die Tabellen neu: Putzplan-Seiten, Push und die Buchhaltungs-App übernehmen es von dort. */
(function(){
  const D=self.DIENST;const app=document.getElementById('app');const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let pw='';try{pw=localStorage.getItem('putzplan.admin')||''}catch(e){}
  let daten=null;const offen=new Map();let neuNr=0;
  const dienst=o=>fetch(D,{method:'POST',body:JSON.stringify({...o,pw})}).then(r=>r.json());
  const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const dat=s=>s?WT[new Date(s+'T12:00:00Z').getUTCDay()]+' '+s.slice(8)+'.'+s.slice(5,7)+'.':'?';
  const unten=document.getElementById('unten'),pub=document.getElementById('pub'),meld=document.getElementById('meldung');
  if(!D){app.innerHTML='<div class="hinweis">Der Dienst ist noch nicht eingerichtet.</div>';return}

  function anmelden(fehler){unten.hidden=true;app.innerHTML='<form class="anmelden" id="f"><b>Anmelden</b><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" required>'
    +(fehler?'<div style="color:#D93636;font-size:16px">'+esc(fehler)+'</div>':'')+'<button class="knopf">Weiter</button></form>';
    document.getElementById('f').onsubmit=async e=>{e.preventDefault();pw=document.getElementById('pw').value.trim();
      const r=await dienst({typ:'login'}).catch(()=>null);if(r&&r.ok){try{localStorage.setItem('putzplan.admin',pw)}catch(e){}laden()}else anmelden(r?'Passwort falsch (nach 10 Fehlversuchen 10 Minuten gesperrt).':'Keine Verbindung.')}}

  async function laden(){const r=await dienst({typ:'liste'}).catch(()=>null);if(!r||!r.ok){anmelden(r&&r.fehler==='passwort'?'Bitte anmelden.':'Keine Verbindung.');return}
    daten=r;offen.clear();unten.hidden=false;zeigen()}

  /* aktueller Stand einer Buchung = Server + noch nicht veröffentlichte Änderungen */
  const stand=b=>({...b,...((offen.get(b.id)||{}).felder||{})});
  const fehlt=b=>b.status!=='storniert'&&(!b.gaeste||!b.abreise||!b.wg||!b.haus)&&(b.abreise||b.anreise||'9')>=daten.heute;
  const wohnungen=()=>daten.haeuser.flatMap(h=>h.wgs.map(w=>({wert:h.id+'|'+w,text:h.name.replace(/ \d+$/,'')+' · WG '+w+' – '+((h.namen||{})[w]||'')})));
  const wohnText=b=>{const h=daten.haeuser.find(x=>x.id===b.haus);return h?h.name+' · WG '+(b.wg||'?')+(b.wg&&(h.namen||{})[b.wg]?' – '+h.namen[b.wg]:''):'Haus unbekannt'};

  function karte(b0){const b=stand(b0);const f=fehlt(b);const g=offen.has(b.id);
    const sel='<select data-k="wohnung"><option value="">– Wohnung wählen –</option>'+wohnungen().map(o=>'<option value="'+o.wert+'"'+(o.wert===b.haus+'|'+b.wg?' selected':'')+'>'+esc(o.text)+'</option>').join('')+'</select>';
    return '<div class="bu'+(g?' geaendert':f?' fehlt':'')+(b.status==='storniert'?' storno':'')+'" data-id="'+esc(b.id)+'">'
      +'<div class="kopf2"><b>'+dat(b.anreise)+' → '+dat(b.abreise)+'</b><span class="klein">'+esc(b.quelle==='airbnb'?'Airbnb':b.quelle==='booking'?'Booking':'Direkt')+(b.status==='storniert'?' · wird storniert':'')+'</span></div>'
      +'<div class="wo">'+esc(wohnText(b))+'</div><div class="klein">'+esc(b.gast||'Name fehlt')+(b.code?' · '+esc(b.code):'')+'</div>'
      +'<div class="raster"><label class="feld breit'+(!b.wg||!b.haus?' rot':'')+'">Wohnung'+sel+'</label>'
      +'<label class="feld">Anreise<input type="date" data-k="anreise" value="'+esc(b.anreise)+'"></label>'
      +'<label class="feld'+(!b.abreise?' rot':'')+'">Abreise (bis wann)<input type="date" data-k="abreise" value="'+esc(b.abreise)+'"></label>'
      +'<label class="feld'+(!b.gaeste?' rot':'')+'">Personen<input type="number" inputmode="numeric" min="1" max="20" data-k="gaeste" value="'+esc(b.gaeste)+'"></label>'
      +'<label class="feld">Name<input type="text" data-k="gast" value="'+esc(b.gast)+'"></label></div>'
      +'<div class="zeile"><button class="link" data-a="storno">'+(b.status==='storniert'?'doch nicht stornieren':'Stornieren')+'</button></div></div>'}

  function zaehler(){pub.disabled=!offen.size;pub.textContent=offen.size?'Veröffentlichen ('+offen.size+')':'Veröffentlichen'}
  function zeigen(){const L=daten.buchungen.filter(b=>stand(b).status!=='storniert'||offen.has(b.id)).slice().sort((a,b)=>(stand(a).anreise||'').localeCompare(stand(b).anreise||''));const heute=daten.heute;
    const kommend=L.filter(b=>(stand(b).abreise||stand(b).anreise||'9')>=heute),vorbei=L.filter(b=>(stand(b).abreise||stand(b).anreise||'9')<heute);
    const rot=kommend.filter(b=>fehlt(stand(b))&&!offen.has(b.id)),rest=kommend.filter(b=>!rot.includes(b));
    app.innerHTML='<div class="leiste"><button class="knopf hell" data-a="neu">+ Neue Buchung</button><button class="knopf hell" data-a="abgleich">Gmail jetzt abgleichen</button><button class="knopf hell" data-a="abmelden">Abmelden</button></div>'
      +(rot.length?'<div class="abschnitt rot">Fehlt etwas ('+rot.length+')</div>'+rot.map(karte).join(''):'')
      +'<div class="abschnitt">Kommend – beide Häuser</div>'+(rest.map(karte).join('')||'<div class="hinweis">Keine.</div>')
      +(vorbei.length?'<div class="abschnitt">Letzte 14 Tage</div>'+vorbei.reverse().map(karte).join(''):'');
    zaehler()}

  function merken(karteEl){const id=karteEl.dataset.id;const b=daten.buchungen.find(x=>x.id===id);const o=offen.get(id)||{id,felder:{}};
    karteEl.querySelectorAll('[data-k]').forEach(i=>{if(i.dataset.k==='wohnung'){const[h,w]=(i.value||'|').split('|');o.felder.haus=h||'';o.felder.wg=w||''}else o.felder[i.dataset.k]=i.value});
    /* nur echte Unterschiede zählen */
    for(const k of Object.keys(o.felder))if(String(o.felder[k]??'')===String(b[k]??''))delete o.felder[k];
    if(Object.keys(o.felder).length||/^neu/.test(id))offen.set(id,o);else offen.delete(id);
    karteEl.classList.toggle('geaendert',offen.has(id));zaehler();meld.textContent=''}

  app.addEventListener('change',e=>{const k=e.target.closest('.bu');if(k)merken(k)});
  app.addEventListener('input',e=>{const k=e.target.closest('.bu');if(k&&e.target.dataset.k!=='wohnung')merken(k)});
  app.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='abmelden'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem abmelden?'))return;pw='';try{localStorage.removeItem('putzplan.admin')}catch(err){}anmelden();return}
    if(a==='abgleich'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem neu laden?'))return;t.disabled=true;t.textContent='Gmail wird gelesen …';await dienst({typ:'abgleich'}).catch(()=>null);await laden();return}
    if(a==='neu'){const id='neu'+(++neuNr);daten.buchungen.push({id,quelle:'direkt',status:'bestaetigt',haus:'',wg:'',anreise:daten.heute,abreise:'',gaeste:'',gast:''});
      offen.set(id,{id,felder:{anreise:daten.heute}});zeigen();const el=app.querySelector('[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center'});return}
    if(a==='storno'){const k=t.closest('.bu');const id=k.dataset.id;const b=stand(daten.buchungen.find(x=>x.id===id));const o=offen.get(id)||{id,felder:{}};
      o.felder.status=b.status==='storniert'?'bestaetigt':'storniert';offen.set(id,o);zeigen();return}});

  pub.addEventListener('click',async()=>{if(!offen.size)return;pub.disabled=true;pub.textContent='Wird veröffentlicht …';meld.style.color='';
    const r=await dienst({typ:'veroeffentlichen',aenderungen:[...offen.values()]}).catch(()=>null);
    if(r&&r.ok){const n=offen.size;await laden();meld.textContent=n+' Änderung'+(n===1?'':'en')+' veröffentlicht – Putzplan und App sind aktualisiert.'}
    else{meld.style.color='#D93636';meld.textContent='Veröffentlichen ging nicht'+(r&&r.fehler?' ('+r.fehler+')':'')+'. Bitte nochmal.';zaehler()}});

  addEventListener('beforeunload',e=>{if(offen.size){e.preventDefault();e.returnValue=''}});
  pw?laden():anmelden();
})();
</script></body></html>
