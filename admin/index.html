<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Putzplan – Admin</title><link rel="icon" href="../icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../plan.css">
<style>
main{padding-bottom:120px}
.box{background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.box input,.feld input,.feld select{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #D6D6D6;border-radius:10px;background:#fff;color:#161616;width:100%;box-sizing:border-box;min-width:0;max-width:100%}

.knopf:disabled{opacity:.4}
.fehler{color:#D93636;font-size:16px}
.leiste{display:flex;gap:8px;margin:0 0 12px}.leiste .knopf{flex:1;font-size:12px;padding:9px 8px}
.haus{font-size:24px;font-weight:800;margin:6px 4px 8px;letter-spacing:-.01em}
.adm .lab{flex-basis:88px;width:88px;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 8px;gap:1px}
.adm .lab b{font-size:16px}.adm .lab small{font-size:12px;font-weight:500;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}

.abschnitt{font-size:12px;font-weight:700;color:#777;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}.abschnitt.rot{color:#D93636}
.zeile{background:#fff;border-radius:14px;padding:12px 14px;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;border:2px solid transparent}

/* Nur im Admin: Balken in der Farbe der Plattform (Betreiber: „Booking blau, Airbnb pink – damit ich das unterscheiden kann“).

.kd2{padding:8px 0;border-top:1px solid #F2F2F2}.kd2.aus .kdk{color:#9A9A9A;text-decoration:line-through}.kd2.geplant{color:#9A9A9A}
.kdk{display:grid;grid-template-columns:76px 46px minmax(0,1fr);gap:6px;font-size:13px;margin-bottom:6px}.kdk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kdk em{font-style:normal;color:#D93636}

.kalle{width:100%;margin:2px 0 8px;font-size:14px}
.kxbez{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;color:#555;min-height:36px}.kxbez input{width:20px;height:20px;accent-color:#2B8C78;margin:0}

.kdet summary{font-size:14px;color:#1E6E5C;font-weight:600;min-height:40px;display:flex;align-items:center;cursor:pointer}

.kweg{width:44px;height:44px;border:0;border-radius:10px;background:#FDECEC;color:#A51B1B;font-size:20px;cursor:pointer}
.kplus{margin:10px 0 4px;width:100%}
.kleer{font-size:14px;color:#777;padding:10px 0}
.kz3{display:grid;grid-template-columns:minmax(0,1fr) 70px 96px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F0}
.kz3 .kbetrag small.rot{color:#D93636;font-size:12px;font-weight:600}
.keinst{width:100%;margin:16px 0 0;display:flex;align-items:center;justify-content:center;gap:8px}
.bkopf .zu{margin-left:auto;flex:none;width:44px;height:44px;border:0;border-radius:22px;background:#F0F0F0;color:#161616;font-size:24px;line-height:1;cursor:pointer}
.bsum{padding:10px 12px;background:#F6F6F6;border-radius:12px}
.kx2{grid-template-columns:minmax(0,1fr) auto 44px}.kx2 .kpreis{grid-column:1;grid-row:2}.kx2 .kxbez{grid-column:2;grid-row:2;min-height:44px}.kx2 .kweg{grid-column:3;grid-row:2}
.einst{background:#F6F6F6;border-radius:14px;padding:2px 12px}
.ez{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #E8E8E8}.ez:last-child{border:0}
.ez b{display:block;font-size:16px}.ez small{display:block;font-size:12px;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neuz{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:#161616;background:#fff;border:1px solid #ECECEC;border-radius:14px;padding:10px 12px;cursor:pointer}
.neut{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}.neut b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.neut span{font-size:13px;color:#666}
.neuz .pfeil{font-size:22px;color:#AAA}
/* Reiter Events */
.reiter.klein2{margin:-4px 0 12px}.reiter.klein2 button{min-height:34px;font-size:13px}
.evkal{background:#fff;border-radius:16px;padding:10px 8px}
.evwt,.evgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.evwt span{text-align:center;font-size:11px;font-weight:700;color:#8A8A8A;padding-bottom:4px}
.evtag{position:relative;aspect-ratio:1/1.12;border:0;border-radius:10px;background:#F6F6F6;font:inherit;color:#161616;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 3px;gap:1px;min-width:0}
.evtag b{font-size:14px}.evtag small{font-size:10px;font-weight:800;color:#8A2400}.evtag.stark{box-shadow:inset 0 0 0 1.5px #C23A00}
.evtag i{position:absolute;bottom:4px;display:flex;gap:2px}.evtag em,.evleg em{display:inline-block;width:6px;height:6px;border-radius:3px}
.evtag.heute{box-shadow:inset 0 0 0 2px #161616}.evtag.vorbei{opacity:.45}

.evzeile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:#161616;background:#fff;border:0;border-radius:14px;padding:10px 12px 10px 0;margin:0 0 8px;cursor:pointer;overflow:hidden}
.blatt .evzeile{border:1px solid #ECECEC;margin:0}
.evzeile.aus{opacity:.5}
.evbalken{flex:none;width:5px;align-self:stretch;border-radius:0 3px 3px 0}

<body><header><div class="kz"><div><span class="ort">Admin</span><h1>Buchungen</h1></div><div class="zeiten"><div class="st de"><span>Deutschland</span><b id="dezeit"></b></div><div class="st"><span>Stand</span><b id="stand"></b></div></div></div></header>
<main id="app"><div class="hinweis">…</div></main>
<div class="unten" id="unten" hidden><div class="innen"><div class="meldung" id="meldung"></div><button class="knopf" id="pub" disabled>Veröffentlichen</button></div></div>
<dialog class="blatt" id="blatt"><form class="in" id="blattForm" method="dialog"></form></dialog>
<script src="../dienst.js"></script>
<script>
/* Admin (nur für den Betreiber): beide Häuser als Kalender. Buchung antippen → ändern/verlängern/stornieren; leeren Tag
   antippen → blockieren (Personen, bis wann). Alles wird gesammelt und erst mit „Veröffentlichen“ an den Dienst geschickt,
   der dann Putzplan-Seiten, Push und die Buchhaltungs-App aktualisiert. Anmeldung mit der PIN aus dem privaten Blatt „Info“ (nur ein Admin). */
(function(){
  const D=self.DIENST;const app=document.getElementById('app');const W=48,LAB=88;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* Angemeldet bleiben: die PIN merkt sich nur DIESES Gerät, 7 Tage lang */
  const TAGE7=7*864e5;let pin='';try{pin=localStorage.getItem('putzplan.pin')||'';if(!(+localStorage.getItem('putzplan.pinBis')>Date.now())){pin='';localStorage.removeItem('putzplan.pin')}}catch(e){}
  let daten=null;const offen=new Map();let neuNr=0,scrollX=null;let ansicht='buchungen';
  /* Reine Lese-Abfragen fassen nach 1,5 s einmal nach – der Dienst hat ab und zu einen kurzen Aussetzer (v. a. direkt nach
     einer neuen Version). Schreibende Abfragen NIE wiederholen: Kam die erste doch an, gäbe es eine Buchung doppelt. */
  const NUR_LESEN=['login','liste','putzkosten'];
  const dienstEinmal=o=>fetch(D,{method:'POST',body:JSON.stringify({...o,pin})}).then(r=>r.json());
  const dienst=o=>dienstEinmal(o).catch(err=>{if(!NUR_LESEN.includes(o.typ))throw err;return new Promise(r=>setTimeout(r,1500)).then(()=>dienstEinmal(o))});
  const WT=['So','Mo','Di','Mi','Do','Fr','Sa'];
  /* Alle Zeiten nach deutscher Zeit – der Admin wird auch aus dem Ausland (Thailand) bedient */
  const deUhr=()=>new Date().toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit'});
  const deIso=()=>{const t={};for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()))t[x.type]=x.value;return t.year+'-'+t.month+'-'+t.day};
  const deTick=()=>{const e=document.getElementById('dezeit');if(e)e.textContent=new Date().toLocaleString('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','')};
  deTick();setInterval(deTick,15000);
  /* Über Mitternacht (deutsche Zeit) offen gelassen: beim Zurückkommen neu laden – aber nie, solange Ungespeichertes offen ist */
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){deTick();if(typeof daten!=='undefined'&&daten&&daten.heute&&daten.heute!==deIso()&&!offen.size)laden()}});
  const plus=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  const tage=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5);
  const dat=s=>s?WT[new Date(s+'T12:00:00Z').getUTCDay()]+' '+s.slice(8)+'.'+s.slice(5,7)+'.':'?';
  const unten=document.getElementById('unten'),pub=document.getElementById('pub'),meld=document.getElementById('meldung');
  const blatt=document.getElementById('blatt'),bf=document.getElementById('blattForm');
  if(!D){app.innerHTML='<div class="hinweis">Der Dienst ist noch nicht eingerichtet.</div>';return}

  /* ---------- Anmeldung mit PIN ---------- */
  function anmelden(fehler){unten.hidden=true;
    app.innerHTML='<form class="box" id="f"><b>Anmelden</b><input class="pin" type="password" inputmode="numeric" pattern="[0-9]*" id="p1" placeholder="PIN" autocomplete="current-password" required>'
      +(fehler?'<div class="fehler">'+esc(fehler)+'</div>':'')+'<button class="knopf">Weiter</button></form>';
    document.getElementById('f').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('p1').value.trim();
      const r=await dienst({typ:'login'}).catch(()=>null);if(r&&r.ok){try{localStorage.setItem('putzplan.pin',pin);localStorage.setItem('putzplan.pinBis',String(Date.now()+TAGE7))}catch(e){}laden()}else anmelden(r?'PIN falsch (nach 5 Fehlversuchen 1 Stunde gesperrt).':'Keine Verbindung.')}}

  const NEU_KEY='putzplan.gesehen';const neuJetzt=new Set();

  function kalender(h,von,N){const heute=daten.heute;const L=alle().filter(b=>b.haus===h.id&&b.status!=='storniert');

  function zeigen(){if(ansicht!=='buchungen')return;const heute=daten.heute;const von=plus(heute,-7);

  /* Direkt zur Buchung im Gastgeber-Bereich (wie die Links in den Mails, ohne deren Sitzungs-Zeichen – dort ggf. einloggen) */

  function zaehler(){pub.disabled=!offen.size;pub.textContent=offen.size?'Veröffentlichen ('+offen.size+')':'Veröffentlichen'}

  /* Buchungsnummer mit einem Tipp in die Zwischenablage; ältere Safari-Fassungen über ein verstecktes Feld */

  /* ---------- Reiter „Putzkosten“: was an die Putzkräfte zu zahlen ist ----------

     Jede gemachte Reinigung hat einen Stand: offen · bezahlt · zählt nicht (Betreiber: „auf einzelne Buchungen
     ausgezahlt oder nicht zählen auswählen – dann brauchen wir kein Feld für extra ausgezahlt“). Ein eigener Reiter

  const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

  const zahl=s=>{const t=String(s==null?'':s).replace(/[\s€]/g,'');if(!t)return null;const n=parseFloat(t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isFinite(n)?n:null};
  const monatPlus=(m,n)=>{let[y,mo]=m.split('-').map(Number);mo+=n;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+'-'+String(mo).padStart(2,'0')};
  const monatName=m=>MONATE[+m.slice(5)-1]+' '+m.slice(0,4);

  const monatKopf=()=>'<div class="monatwahl"><button type="button" data-k="zurueck" aria-label="Voriger Monat">‹</button><b>'+monatName(kMonat)+'</b><button type="button" data-k="vor" aria-label="Nächster Monat">›</button></div>';

  function reiterWechsel(k){if(k===ansicht)return;ansicht=k;document.querySelector('header h1').textContent=REITER.find(r=>r[0]===k)[1];
    unten.hidden=k!=='buchungen';if(k==='kosten')kostenLaden(kMonat||deIso().slice(0,7));else if(k==='events')evLaden();else zeigen()}
  async function kostenLaden(m){kMonat=m;const nr=++kNr;app.innerHTML=reiter()+monatKopf()+'<div class="hinweis">Wird geladen …</div>';
    const r=await dienst({typ:'putzkosten',monat:m}).catch(()=>null);if(nr!==kNr||ansicht!=='kosten')return;
    if(!r||!r.ok){app.innerHTML=reiter()+monatKopf()+'<div class="warn">'+dienstFehler(r)+'</div>';return}
    const d=r.daten||{preise:Object.assign({},r.vorlage||{}),extras:[]};const heute=r.heute||deIso();

      stand:{preise:d.preise||{},extras:(d.extras||[]).map(x=>Object.assign({},x)),status:Object.assign({},d.status||{})},vorschlag:!r.daten&&!!r.vorlage};kostenZeigen()}
  const zaehlt=p=>kDaten.stand.status[pKey(p)]!=='aus';
  function kostenSummen(){const s=kDaten.stand;const H={};let gesamt=0,bez=0;
    for(const h of kDaten.haeuser){let z=0,b=0;
      for(const p of kDaten.gemacht){if(p.haus!==h.id||!zaehlt(p))continue;const pr=+s.preise[h.id+'-'+p.wg]||0;z+=pr;if(s.status[pKey(p)]==='bezahlt')b+=pr}
      for(const x of s.extras)if(x.haus===h.id){z+=+x.betrag||0;if(x.bezahlt)b+=+x.betrag||0}

  const kopfText=S=>{const P=kDaten.gemacht.filter(zaehlt),G=kDaten.geplant;const raus=kDaten.gemacht.length-P.length;const bis=kDaten.heute.slice(0,7)===kMonat?' bis heute ('+kurz(kDaten.heute)+')':'';
    return P.length+' Reinigung'+(P.length===1?'':'en')+bis+(raus?' · '+raus+' zählt nicht':'')+(G.length?' · '+G.length+' noch geplant':'')};
  const offenText=S=>'<span>bezahlt '+eur(S.bez)+'</span><span class="'+(S.offen>0?'off':'ok')+'">offen '+eur(S.offen)+'</span>';
  const STAENDE=[['','Offen'],['bezahlt','Bezahlt'],['aus','Zählt nicht']];
  const preisFehlt=()=>{const L=[];for(const hs of kDaten.haeuser)for(const w of hs.wgs){if(kDaten.gemacht.some(p=>p.haus===hs.id&&p.wg===+w&&zaehlt(p))&&!(+kDaten.stand.preise[hs.id+'-'+w]>0))L.push(hs.name.replace(/ \d+$/,'')+' WG '+w)}return L};
  /* Hauptseite = nur die Übersicht (Betreiber: „die Preise sind eine Einstellung, wo man nicht immer drangeht“).

  function kostenZeigen(){const s=kDaten.stand,P=kDaten.gemacht,G=kDaten.geplant,S=kostenSummen();const u=P.filter(p=>p.unsicher&&zaehlt(p)).length;const pf=preisFehlt();
    let h=reiter()+monatKopf()
      +'<div class="kgesamt"><span>Zu zahlen für '+monatName(kMonat)+'</span><b id="kGes">'+eur(S.gesamt)+'</b><div class="kbez" id="kBez">'+offenText(S)+'</div><div class="klein" id="kOffen">'+kopfText(S)+'</div></div>'

      +(u?'<div class="klein" style="margin:6px 4px 0;color:#D93636">'+u+' Reinigung'+(u===1?'':'en')+' mit unbekannter Abreise (vorläufig 1 Nacht gezählt) – bitte im Reiter Buchungen ergänzen.</div>':'');
    for(const hs of kDaten.haeuser){const PH=P.filter(p=>p.haus===hs.id),GH=G.filter(p=>p.haus===hs.id);const ex=s.extras.filter(x=>x.haus===hs.id);

        h+='<div class="kz3"><div class="kwg"><b>WG '+w+'</b><small>'+esc((hs.namen||{})[w]||'')+'</small></div>'

  bf.addEventListener('click',e=>{if(!blattArt)return;const t=e.target;

  /* Tippen: nur rechnen; Feld verlassen: speichern. Kein Neuzeichnen beim Tippen (sonst springt der Fokus weg) */

  /* ---------- Reiter „Events“: Veranstaltungen und Preis-Vorschläge (Kalender und Liste) ----------
     Fußball (Heimspiele Borussia) holt der Dienst selbst aus dem Spielplan, am 1. jedes Monats. Alles andere ist
     recherchiert oder selbst eingetragen. Zuschlag = Vorschlag aus Erfahrungswerten, nicht gemessen.
     Nächte: volle Zuschlag in den Nächten der Event-Tage, halber in der Nacht davor (Anreise am Vorabend);
     Messen: die Nächte vor jedem Messetag. Treffen mehrere Events eine Nacht, zählt der höchste Zuschlag. */
  const EV_ART={fussball:['Fußball','#1F8A4C'],konzert:['Konzert','#7B3FE4'],messe:['Messe','#2563EB'],fest:['Fest / Karneval','#E07B00'],sonstiges:['Sonstiges','#6B6B6B']};
  const EV_QUELLE={auto:'Spielplan (automatisch)',recherche:'recherchiert – Termin prüfen',manuell:'selbst eingetragen'};
  let evDaten=null,evAnsicht='kalender',evMonat=null,evNr=0,evTag=null,evId=null;
  const evAktiv=()=>evDaten.events.filter(e=>e.status!=='aus');
  function evNaechte(e){const N=[];if(e.art==='messe'){for(let d=plus(e.von,-1);d<e.bis;d=plus(d,1))N.push([d,1])}
    else{N.push([plus(e.von,-1),.5]);for(let d=e.von;d<=e.bis;d=plus(d,1))N.push([d,1])}return N}
  /* je Nacht: höchster Zuschlag und die Events dahinter */
  function evNachtKarte(){const K={};for(const e of evAktiv())for(const[d,f]of evNaechte(e)){const z=Math.round(e.zuschlag*f/5)*5;const k=K[d]||(K[d]={z:0,ev:[]});if(z>k.z)k.z=z;k.ev.push(e)}return K}
  const evPreis=(gp,z)=>Math.round(gp*(1+z/100));
  async function evLaden(neu){const nr=++evNr;if(!evMonat)evMonat=deIso().slice(0,7);if(!neu)app.innerHTML=reiter()+'<div class="hinweis">Wird geladen …</div>';
    const r=neu||await dienst({typ:'events'}).catch(()=>null);if(nr!==evNr||ansicht!=='events')return;
    if(!r||!r.ok){app.innerHTML=reiter()+'<div class="warn">'+dienstFehler(r)+'</div>';return}evDaten=r;evZeigen()}
  function evZeigen(){const heute=evDaten.heute;

    h+=evAnsicht==='kalender'?evKalender():evListe();

      +'<div class="klein" style="margin:10px 4px">Zuschläge sind Vorschläge aus Erfahrungswerten. Fußball kommt automatisch aus dem Spielplan (am 1. jedes Monats'+(evDaten.stand?', zuletzt '+kurz(evDaten.stand.slice(0,10)):'')+'). Recherchierte Termine bitte beim Veranstalter prüfen.</div>';
    app.innerHTML=h}
  function evKalender(){const K=evNachtKarte();const heute=evDaten.heute;const gp=evDaten.grundpreise||{};const m=evMonat;const y=+m.slice(0,4),mo=+m.slice(5,7);
    const erster=m+'-01';const wt=(new Date(erster+'T12:00:00Z').getUTCDay()+6)%7;const tageImMonat=new Date(Date.UTC(y,mo,0)).getUTCDate();
    let h='<div class="monatwahl"><button type="button" data-evm="-1" aria-label="Voriger Monat">‹</button><b>'+monatName(m)+'</b><button type="button" data-evm="1" aria-label="Nächster Monat">›</button></div>'
      +'<div class="evkal"><div class="evwt">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(t=>'<span>'+t+'</span>').join('')+'</div><div class="evgrid">';

    const M=evAktiv().filter(e=>e.bis>=m+'-01'&&e.von<=m+'-31').sort((a,b)=>a.von.localeCompare(b.von));
    h+='<div class="abschnitt">Im '+MONATE[mo-1]+' ('+M.length+')</div>'+(M.length?M.map(evZeile).join(''):'<div class="kkarte"><div class="kleer">Keine Events in diesem Monat bekannt.</div></div>');
    return h}
  function evZeile(e){const[at,c]=EV_ART[e.art]||EV_ART.sonstiges;const tage=e.bis>e.von?dat(e.von)+' – '+dat(e.bis):dat(e.von);
    return'<button type="button" class="evzeile'+(e.status==='aus'?' aus':'')+'" data-evid="'+esc(e.id)+'"><span class="evbalken" style="background:'+c+'"></span><span class="evtext"><b>'+esc(e.titel)+'</b>'

    if(!L.length)return'<div class="kkarte"><div class="kleer">Keine kommenden Events.</div></div>';let h='',mon='';

  /* Pop-ups */

      h='<div class="bkopf"><div class="bkt"><h2>Grundpreise</h2><div class="unter">Normaler Preis je Nacht – daraus rechnet der Kalender den Vorschlag</div></div>'+SCHLIESSEN+'</div>'
        +evDaten.haeuser.map(hs=>'<div class="abschnitt" style="margin:4px 0 0">'+esc(hs.name)+'</div><div class="einst">'+hs.wgs.map(w=>{const k=hs.id+'-'+w;
          return'<label class="ez"><span><b>WG '+w+'</b><small>'+esc((hs.namen||{})[w]||'')+'</small></span><span class="kpreis"><input inputmode="numeric" autocomplete="off" data-gp="'+k+'" value="'+esc(gp[k]||'')+'" placeholder="0" aria-label="Grundpreis je Nacht, '+esc(hs.name)+' WG '+w+'">€</span></label>'}).join('')+'</div>').join('')
        +'<button type="button" class="knopf hell" data-ev="spielplan">Spielplan jetzt aktualisieren</button>'
        +'<div class="meldung" id="bMeld"></div>'}
    const top=blatt.scrollTop;bf.innerHTML=h;blatt.scrollTop=top}
  function evKlick(e){if(!evDaten)return true;const t=e.target;
    const a=t.closest('[data-evansicht]');if(a){evAnsicht=a.dataset.evansicht;evZeigen();return true}
    const m=t.closest('[data-evm]');if(m){evMonat=monatPlus(evMonat,+m.dataset.evm);evZeigen();return true}
    const d=t.closest('[data-evtag]');if(d){evTag=d.dataset.evtag;evBlattOeffnen('evTag');return true}
    const z=t.closest('[data-evid]');if(z){evId=z.dataset.evid;evBlattOeffnen('evForm');return true}
    const b=t.closest('[data-ev]');if(b){if(b.dataset.ev==='neu'){evId=null;evTag=null;evBlattOeffnen('evForm')}else if(b.dataset.ev==='einst')evBlattOeffnen('evEinst');return true}
    return true}
  function evBlattKlick(e){const t=e.target;
    const z=t.closest('[data-evid]');if(z){evId=z.dataset.evid;blattArt='evForm';evBlattZeichnen();return}
    const b=t.closest('[data-ev]');if(!b)return;const was=b.dataset.ev;
    if(was==='neu'){evId=null;evTag=b.dataset.von||null;blattArt='evForm';evBlattZeichnen();return}
    if(was==='weg'){const ev=evDaten.events.find(x=>x.id===evId);if(!ev)return;
      if(ev.quelle==='auto'&&ev.status==='aus'){evSchicken({typ:'eventSpeichern',event:Object.assign({},ev,{status:''})});return}
      if(!confirm(ev.quelle==='auto'?'Dieses Spiel ausblenden? Es kommt beim nächsten Abruf nicht wieder.':'„'+ev.titel+'“ löschen?'))return;evSchicken({typ:'eventLoeschen',id:ev.id});return}
    if(was==='spielplan'){b.disabled=true;b.textContent='Spielplan wird geholt …';dienst({typ:'eventsAktualisieren'}).catch(()=>null).then(r=>{
      if(r&&r.ok){evDaten=r;evZeigen();evBlattZeichnen();const m=document.getElementById('bMeld');if(m)m.textContent=(r.ergebnis?r.ergebnis.spiele+' Heimspiele gefunden, '+r.ergebnis.neu+' neu':'')+' ✓'}
      else{b.disabled=false;b.textContent='Spielplan jetzt aktualisieren';alert(dienstFehler(r))}})}}
  function evSpeichern(){const f=bf.elements;const ev=evId?evDaten.events.find(x=>x.id===evId):{};const z=parseInt(String(f.zuschlag.value).replace(/[^\d-]/g,''),10);
    const neu=Object.assign({},ev,{id:evId||undefined,zuschlag:isFinite(z)?z:0,notiz:f.notiz.value});
    if(f.titel){Object.assign(neu,{titel:f.titel.value,von:f.von.value,bis:f.bis.value||f.von.value,art:f.art.value,ort:f.ort.value,link:f.link.value.trim()});
      if(!neu.titel.trim()||!neu.von){alert('Bitte Titel und Datum eintragen.');return}if(neu.bis<neu.von){alert('„Bis“ liegt vor „Von“.');return}}
    evSchicken({typ:'eventSpeichern',event:neu})}
  function evSchicken(o){const ok=bf.querySelector('#evOk');if(ok){ok.disabled=true;ok.textContent='Wird gespeichert …'}
    dienst(o).catch(()=>null).then(r=>{if(r&&r.ok){evDaten=r;blatt.close();evZeigen()}else{if(ok){ok.disabled=false;ok.textContent='Speichern'}alert(r&&r.fehler==='eingabe'?'Bitte Titel und Datum prüfen.':dienstFehler(r))}})}
  /* Grundpreise: Feld verlassen → speichern */
  bf.addEventListener('change',e=>{if(blattArt!=='evEinst'||!e.target.dataset.gp)return;const gp=Object.assign({},evDaten.grundpreise||{});const n=parseInt(e.target.value,10);
    if(n>0)gp[e.target.dataset.gp]=n;else delete gp[e.target.dataset.gp];const m=document.getElementById('bMeld');if(m)m.textContent='Wird gespeichert …';
    dienst({typ:'grundpreiseSpeichern',preise:gp}).catch(()=>null).then(r=>{const m2=document.getElementById('bMeld');if(r&&r.ok){evDaten.grundpreise=r.grundpreise;if(m2)m2.textContent='Gespeichert ✓'}else if(m2){m2.style.color='#D93636';m2.textContent='Speichern ging nicht.'}})});

  /* ---------- Neue Buchungen: beim Öffnen ein Pop-up mit allem, was seit dem letzten Öffnen dazugekommen ist ----------
     Grundlage ist dieselbe Merkliste wie beim ✨ im Kalender (je Gerät). Jede Buchung erscheint EINMAL im Pop-up;
     kommt beim Gmail-Abgleich direkt nach dem Öffnen noch etwas dazu, wird das offene Pop-up ergänzt. */
  const neuGezeigt=new Set();let neuListe=[];
  function neuInhalt(){const L=neuListe.map(id=>daten.buchungen.find(b=>b.id===id)).filter(Boolean);
    return'<div class="bkopf"><div class="bkt"><h2>✨ '+L.length+' neue Buchung'+(L.length===1?'':'en')+'</h2><div class="unter">seit du den Admin zuletzt geöffnet hast</div></div>'+SCHLIESSEN+'</div>'
      +L.map(b=>{const h=hausVon(b.haus);const n=b.abreise&&b.anreise?tage(b.anreise,b.abreise):null;
        return'<button type="button" class="neuz" data-neu="'+esc(b.id)+'">'+quelleLogo(b.quelle==='airbnb'||b.quelle==='booking'?b.quelle:'block')+'<span class="neut"><b>'+esc(b.gast||'Ohne Name')+'</b>'
          +'<span>'+esc(h?h.name:'Wohnung fehlt')+(b.wg?' · WG '+esc(b.wg):'')+'</span><span>'+dat(b.anreise)+' → '+dat(b.abreise)+(n?' · '+n+' Nacht'+(n===1?'':'e'):'')+(b.gaeste?' · '+esc(b.gaeste)+' Pers.':'')+'</span></span><span class="pfeil">›</span></button>'}).join('')
      +'<button type="button" class="knopf" data-b="zu">OK</button>'}
  function neuZeigen(){const frisch=[...neuJetzt].filter(id=>!neuGezeigt.has(id)&&daten.buchungen.some(b=>b.id===id));if(!frisch.length)return;
    const offenNeu=blatt.open&&blattArt==='neu';if(blatt.open&&!offenNeu)return;/* nie über ein offenes anderes Blatt legen – das ✨ im Kalender bleibt */
    frisch.forEach(id=>neuGezeigt.add(id));neuListe=offenNeu?neuListe.concat(frisch):frisch;
    neuListe.sort((a,b)=>{const x=daten.buchungen.find(o=>o.id===a)||{},y=daten.buchungen.find(o=>o.id===b)||{};return(x.anreise||'').localeCompare(y.anreise||'')});
    blattArt='neu';blattZeichnen();bf.onsubmit=e=>{e.preventDefault()};if(!blatt.open)blatt.showModal()}

  /* ---------- Blatt: Buchung ändern oder Tag blockieren ---------- */
  const zeitOpt=(L,v)=>'<option value=>nein</option>'+L.concat(v&&!L.includes(v)?[v]:[]).map(t=>'<option'+(t===v?' selected':'')+'>'+t+'</option>').join('');
  function oeffnen(id,vorgabe){blattArt=null;const neu=!id;const b=neu?{id:'neu'+(++neuNr),quelle:'direkt',status:'bestaetigt',...vorgabe}:stand(daten.buchungen.find(x=>x.id===id));
    const h=hausVon(b.haus);const wohn=daten.haeuser.flatMap(x=>x.wgs.map(w=>({v:x.id+'|'+w,t:x.name.replace(/ \d+$/,'')+' · WG '+w+' – '+((x.namen||{})[w]||'')})));
    const nN=b.anreise&&b.abreise?tage(b.anreise,b.abreise):0;const ue=neu?[]:ueberVon(b);
    bf.innerHTML='<div class="bkopf">'+quelleLogo(neu?'block':b.quelle)+'<div class="bkt"><h2>'+(neu?'Blockieren':esc(b.gast||'Buchung'))+'</h2><div class="unter">'+(neu?esc(h?h.name:''):esc(b.quelle==='airbnb'?'Airbnb':b.quelle==='booking'?'Booking.com':'Direkt')+(b.pruefen?' · geändert – bitte prüfen':''))+'</div></div></div>'
      +(ue.length?'<div class="warn">Überschneidet sich mit '+ue.map(o=>esc(o.gast||(o.quelle==='airbnb'?'Airbnb':'Booking'))+' ('+dat(o.anreise)+' → '+dat(o.abreise)+')').join(', ')+'. Eine der Buchungen ist vermutlich storniert oder verlegt – bitte bei Airbnb/Booking prüfen.</div>':'')
      +(neu||!b.code?'':'<div class="codezeile"><button type="button" class="code" id="bCode" title="Buchungsnummer kopieren"><span>'+esc(b.code)+'</span></button>'
        +(quelleLink(b)?'<a class="extlink" href="'+esc(quelleLink(b))+'" target="_blank" rel="noopener" title="'+(b.quelle==='airbnb'?'Bei Airbnb öffnen':'Bei Booking öffnen')+'">'+'Öffnen</a>':'')+'</div>')
      +'<div class="raster"><label class="feld breit">Wohnung<select name="wohnung">'+wohn.map(o=>'<option value="'+o.v+'"'+(o.v===b.haus+'|'+b.wg?' selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select></label>'
      +'<label class="feld breit">'+(neu?'Ab':'Anreise')+'<input type="date" name="anreise" value="'+esc(b.anreise)+'" required></label>'
      +'<label class="feld'+(!b.abreise?' rot':'')+'">Nächte<select name="naechte"><option value="">–</option>'+[...Array(30)].map((_,i)=>i+1).concat(nN>30?[nN]:[]).map(n=>'<option'+(nN===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label>'
      +'<label class="feld'+(!b.abreise?' rot':'')+'">Bis wann<input type="date" name="abreise" value="'+esc(b.abreise)+'"></label>'
      +'<label class="feld'+(!b.gaeste?' rot':'')+'">Personen<select name="gaeste"><option value="">–</option>'+[1,2,3,4,5,6,7].concat(+b.gaeste>7?[+b.gaeste]:[]).map(n=>'<option'+(+b.gaeste===n?' selected':'')+'>'+n+'</option>').join('')+'</select></label>'
      +'<label class="feld">Name<input type="text" name="gast" value="'+esc(b.gast)+'" placeholder="'+(neu?'Blockiert':'')+'"></label></div>'
      +'<div class="putzinfo"><div class="pih">Für die Putzkräfte</div><div class="raster">'
      +'<label class="feld">Early Check-in<select name="frueh">'+zeitOpt(['09:00','10:00','11:00','12:00','13:00','14:00'],b.frueh)+'</select></label>'
      +'<label class="feld">Late Check-out<select name="spaet">'+zeitOpt(['12:00','13:00','14:00','15:00','16:00','17:00'],b.spaet)+'</select></label>'
      +'<label class="feld breit">Notiz<textarea name="notiz" rows="2" maxlength="200" placeholder="z. B. Babybett aufbauen, extra Handtücher">'+esc(b.notiz)+'</textarea></label></div></div>'
      +'<div class="knoepfe"><button class="knopf hell" type="button" id="bZu">Abbrechen</button><button class="knopf" value="ok" id="bOk">'+(b.pruefen&&!neu?'Geprüft':'Übernehmen')+'</button></div>'
      +(neu?'':'<button class="knopf rot" type="button" id="bStorno">Buchung stornieren</button>');
    bf.querySelector('#bZu').onclick=()=>blatt.close();
    /* Nächte oder „Bis wann“ – das andere rechnet sich aus */
    const fA=bf.elements.anreise,fB=bf.elements.abreise,fN=bf.elements.naechte;
    const ausN=()=>{if(fA.value&&fN.value)fB.value=plus(fA.value,+fN.value)};
    fN.onchange=ausN;fA.onchange=()=>{if(fN.value)ausN()};
    fB.onchange=()=>{const n=fA.value&&fB.value?tage(fA.value,fB.value):0;if(n>0&&![...fN.options].some(o=>+o.value===n))fN.add(new Option(String(n),String(n)));fN.value=n>0?String(n):''};
    const cb=bf.querySelector('#bCode');if(cb)cb.onclick=()=>{cb.style.minWidth=cb.offsetWidth+'px';return kopieren(b.code).then(ok=>{const e=cb.querySelector('span');cb.classList.toggle('ok',ok);e.textContent=ok?'Kopiert ✓':'Nicht möglich';clearTimeout(cb.t);cb.t=setTimeout(()=>{cb.classList.remove('ok');e.textContent=b.code},1500)})};/* ganze Nummer antippen = kopieren */
    const nehmen=status=>{const f=new FormData(bf);const[hh,ww]=String(f.get('wohnung')||'|').split('|');
      const felder={haus:hh,wg:ww,anreise:f.get('anreise')||'',abreise:f.get('abreise')||'',gaeste:f.get('gaeste')||'',gast:f.get('gast')||(neu?'Blockiert':''),frueh:f.get('frueh')||'',spaet:f.get('spaet')||'',notiz:String(f.get('notiz')||'').trim()};
      if(b.pruefen&&!neu)felder.geprueft='1';/* auch ohne Änderung: „Geprüft“ veröffentlichen nimmt das Gelb weg */
      if(felder.abreise&&felder.anreise&&felder.abreise<=felder.anreise){alert('„Bis wann“ muss nach dem Anfang liegen.');return false}
      if(status)felder.status=status;
      if(neu){daten.buchungen.push({id:b.id,quelle:'direkt',status:'bestaetigt'});offen.set(b.id,{id:b.id,felder})}
      else{const alt=daten.buchungen.find(x=>x.id===id);const o=offen.get(id)||{id,felder:{}};Object.assign(o.felder,felder);
        for(const k of Object.keys(o.felder))if(String(o.felder[k]??'')===String(alt[k]??''))delete o.felder[k];
        if(Object.keys(o.felder).length)offen.set(id,o);else offen.delete(id)}
      blatt.close();meld.textContent='';zeigen();return true};
    bf.onsubmit=e=>{e.preventDefault();nehmen()};
    const st=bf.querySelector('#bStorno');if(st)st.onclick=()=>{if(confirm('Diese Buchung stornieren? Sie verschwindet nach dem Veröffentlichen überall.'))nehmen('storniert')};
    blatt.showModal()}

  app.addEventListener('click',async e=>{if(kostenKlick(e))return;const a=e.target.closest('[data-a]');
    if(a){if(a.dataset.a==='abmelden'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem abmelden?'))return;pin='';try{localStorage.removeItem('putzplan.pin')}catch(err){}anmelden();return}
      if(a.dataset.a==='abgleich'){if(offen.size&&!confirm('Nicht veröffentlichte Änderungen gehen verloren. Trotzdem neu laden?'))return;a.disabled=true;a.textContent='Gmail wird gelesen …';await dienst({typ:'abgleich',tage:45}).catch(()=>null);await laden();return}}
    const bar=e.target.closest('.bk[data-id],.zeile[data-id]');if(bar){oeffnen(bar.dataset.id);return}
    const t=e.target.closest('.trk[data-wg]');if(t){const r=t.getBoundingClientRect();const i=Math.floor((e.clientX-r.left)/W);const d=plus(plus(daten.heute,-7),i);
      oeffnen(null,{haus:t.dataset.haus,wg:t.dataset.wg,anreise:d,abreise:plus(d,1),gaeste:2,gast:''})}});
  blatt.addEventListener('click',e=>{if(e.target===blatt)blatt.close()});

  pub.addEventListener('click',async()=>{if(!offen.size)return;pub.disabled=true;pub.textContent='Wird veröffentlicht …';meld.style.color='';
    const r=await dienst({typ:'veroeffentlichen',aenderungen:[...offen.values()]}).catch(()=>null);
    if(r&&r.ok){const n=offen.size;await laden();meld.textContent=n+' Änderung'+(n===1?'':'en')+' veröffentlicht – Putzplan und App sind aktualisiert.'}
    else{meld.style.color='#D93636';meld.textContent='Veröffentlichen ging nicht'+(r&&r.fehler?' ('+r.fehler+')':'')+'. Bitte nochmal.';zaehler()}});
  addEventListener('beforeunload',e=>{if(offen.size){e.preventDefault();e.returnValue=''}});
  pin?laden():anmelden();
})();
</script></body></html>
